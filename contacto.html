<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="js/main.js"></script>

    <!-- AOS Animaciones -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

</head>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
    AOS.init();
</script>

<body>

<nav class="navbar navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand text-danger" href="index.html">CrossFit Power</a>
    </div>
</nav>

<div class="container mt-5">

    <h2>Contáctanos</h2>

    <form id="formContacto" class="mt-4">

        <input type="text" id="nombre" class="form-control mb-3" placeholder="Nombre" required>

        <input type="email" class="form-control mb-3" placeholder="Correo" required>

        <textarea class="form-control mb-3" placeholder="Mensaje" required></textarea>

        <button class="btn btn-danger w-100">
            Enviar
        </button>

    </form>

    <div id="respuesta" class="alert alert-success mt-3" style="display:none;"></div>

</div>

<footer>
    <p>Únete hoy 🏋️‍♂️</p>
</footer>

</body>
</html>
